<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>COMP3097 – Practice Exam (Quiz 1–6)</title>

  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    .header {
      background: #2c3e50;
      color: white;
      padding: 25px;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .header-sub {
      font-size: 14px;
      font-weight: normal;
      opacity: 0.9;
      margin-top: 6px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .section-title {
      margin-top: 18px;
      margin-bottom: 10px;
      font-size: 20px;
      font-weight: 700;
      color: #34495e;
      border-left: 4px solid #3498db;
      padding-left: 10px;
    }

    .question-card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    .question-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }

    label.option {
      display: block;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid transparent;
      margin: 6px 0;
    }

    label.option:hover {
      background: #eef2f7;
    }

    input[type="radio"] {
      margin-right: 8px;
    }

    /* clearer feedback */
    .correct {
      background: #d9fbe0 !important;
      border: 1px solid #2ecc71 !important;
      border-left: 6px solid #2ecc71 !important;
    }

    .incorrect {
      background: #ffe0e0 !important;
      border: 1px solid #e74c3c !important;
      border-left: 6px solid #e74c3c !important;
    }

    .feedback {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .feedback.ok {
      display: block;
      background: #ecfdf3;
      border: 1px solid #2ecc71;
      color: #14532d;
    }

    .feedback.bad {
      display: block;
      background: #fff1f2;
      border: 1px solid #e74c3c;
      color: #7f1d1d;
    }

    .btn-submit {
      display: block;
      width: 100%;
      padding: 15px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover { background: #2980b9; }

    .btn-reset {
      display: block;
      width: 100%;
      padding: 12px;
      background: #ffffff;
      color: #2c3e50;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 10px;
    }

    .btn-reset:hover { background: #f0f3f7; }

    .result-box {
      margin-top: 25px;
      padding: 20px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      display: none;
    }

    details.key {
      margin-top: 18px;
      background: #f0f3f7;
      border-radius: 10px;
      padding: 10px 12px;
      display: none;
    }

    details.key summary {
      cursor: pointer;
      font-weight: 700;
      padding: 10px 4px;
    }

    .key-body {
      padding: 6px 4px 12px;
      font-size: 14px;
      line-height: 1.7;
    }

    code { background:#f3f4f6; padding:2px 5px; border-radius:6px; }
  </style>
</head>

<body>
  <div class="header">
    COMP3097 – Practice Exam (Quiz 1–6)
    <div class="header-sub">Choices randomized each refresh • Clear feedback after submit</div>
  </div>

  <div class="container">
    <form id="quizForm"></form>

    <button type="button" class="btn-submit" onclick="submitQuiz()">Submit Exam</button>
    <button type="button" class="btn-reset" onclick="resetQuiz()">Reset (and reshuffle)</button>

    <div id="result" class="result-box"></div>

    <details id="answerKeyWrap" class="key">
      <summary>Show Answer Key (Correct choice + text)</summary>
      <div id="answerKey" class="key-body"></div>
    </details>
  </div>

  <script>
    // -----------------------------
    // DATA: Questions with correctIndex (0-based)
    // We'll shuffle choices but preserve correctness.
    // -----------------------------
    const sections = [
      {
        title: "Quiz 1 — Swift Basics",
        questions: [
          { text:"In Swift, functions can be passed as parameters to other functions and they can be returned from functions.", choices:["True","False"], correctIndex:0 },
          { text:"In Swift, all types contain a nil as a possible value", choices:["True","False"], correctIndex:1 },
          { text:"How the optional type is denoted in Swift?", choices:[
              "by adding a question mark (?) after the name of the type",
              "by adding an exclamation mark (!) after the name of the type",
              "by adding a question mark (?) infront of the name of the type",
              "by adding an exclamation mark (!) infront of the name of the type"
            ], correctIndex:0
          },
          { text:"Which statement can be used to declare an integer constant of value 5 in Swift?", choices:[
              "let x = 5","let Int x = 5","const x:Int","x=5","const x = 5"
            ], correctIndex:0
          },
          { text:"Which of the following is true?", choices:[
              "In Swift, values are never converted (cast operation) automatically to another type",
              "In Swift, values are always converted (cast operation) automatically to another type if needed",
              "In Swift, conversion (cast operation) is not possible at all",
              "There is no such thing as a cast operation in programming languages"
            ], correctIndex:0
          },
          { text:"Swift requires each line to be terminated by a semicolon ';'.", choices:["True","False"], correctIndex:1 },
          { text:"For x=5, you want to print: Value of x is: 5\nWhich expression would you use?", choices:[
              "print(\"Value of x is: \\(x)\")",
              "print(\"Value of x is: \"+String(x))",
              "print(\"Value of x is: \", x)",
              "All of the above"
            ], correctIndex:3
          },
          { text:"Which expression allows us to declare an array?", choices:[
              "var shoppingList = [\"catfish\", \"water\", \"tulips\", \"blue paint\"]",
              "var shoppingList = (\"catfish\", \"water\", \"tulips\", \"blue paint\")",
              "array shoppingList = [\"catfish\", \"water\", \"tulips\", \"blue paint\"]",
              "var shoppingList = array[\"catfish\", \"water\", \"tulips\", \"blue paint\"]"
            ], correctIndex:0
          },
          { text:"Which expression declares a function that takes an Int and returns String?", choices:[
              "func foo(a:Int)->String",
              "function foo(a:Int)->String",
              "func foo(a:Int):String",
              "function foo(a:Int):String"
            ], correctIndex:0
          },
          { text:"Swift is ...", choices:[
              "a strongly typed language that allows for type inference",
              "a weakly typed language that allows for type inference",
              "a strongly typed language that does not allow for type inference",
              "a weakly typed language that does not allow for type inference"
            ], correctIndex:0
          }
        ]
      },

      {
        title: "Quiz 2 — Swift Functions & Parameters",
        questions: [
          { text:"In Swift, function is identified by", choices:[
              "keyword func","keyword function","returned type with ->","at least one parameter"
            ], correctIndex:0
          },
          { text:"In:\nfunc swapTwoInts(_ a: inout Int, _ b: inout Int) { (a, b) = (b, a) }\n'_' means:", choices:[
              "when calling the function param labels should not be used",
              "inout means that params are appearing and disappearing",
              "params are output parameters",
              "parameters are optional"
            ], correctIndex:0
          },
          { text:"In Swift a class ...", choices:[
              "can inherit from one class but conform to multiple protocols",
              "can inherit from multiple classes and conform to multiple protocols",
              "can inherit from multiple classes but conform to only one protocol",
              "can inherit from one class and conform to a single protocol"
            ], correctIndex:0
          },
          { text:"Swift allows functions to be nested (a function inside another function).", choices:["True","False"], correctIndex:0 },
          { text:"Consider:\nfunc minMax(array:[Int])->(a:Int, b:Int)?\nBest answer:", choices:[
              "takes array of Ints and returns tuple (two Ints) OR nil",
              "takes array and returns tuple with two Int values",
              "returns tuple with two Int values or nil",
              "returns an Int value or nil"
            ], correctIndex:0
          },
          { text:"Consider:\nfunc add(no1:Int, no2:Int)->Int\nBest answer:", choices:[
              "takes two Int parameters and returns an Int",
              "takes two Int parameters",
              "returns an Int",
              "incorrect declaration"
            ], correctIndex:0
          },
          { text:"How many times will the loop execute?\nfor i in 1...10 { ... }", choices:["5","9","10","11"], correctIndex:2 },
          { text:"In the declaration with inout parameters, 'inout' means:", choices:[
              "param labels must be used",
              "params are appearing and disappearing",
              "params are input and output parameters",
              "parameters are optional"
            ], correctIndex:2
          },
          { text:"The following two functions have the same type.", choices:["True","False"], correctIndex:1 },
          { text:"In:\nfunc pow(firstArg a:Int)->Int\nWhich is correct?", choices:[
              "firstArg is used in the call, a is used in the body",
              "a is used in the call, firstArg is used in the body",
              "firstArg used in call and both names can be used in the body",
              "both are used in call and both used in the body"
            ], correctIndex:0
          }
        ]
      },

      {
        title: "Quiz 3 — SwiftUI",
        questions: [
          { text:"SwiftUI can be only used to define UI for simple applications", choices:["True","False"], correctIndex:1 },
          { text:"SwiftUI uses a declarative approach", choices:["True","False"], correctIndex:0 },
          { text:"The origin of the UI element in iOS app is the upper-left corner", choices:["True","False"], correctIndex:0 },
          { text:"What is SwiftUI?", choices:[
              "an innovative way to build user interfaces using Swift",
              "a UI component defined in Swift",
              "a UI component allowing user to code in Swift",
              "a scripting language that supports Storyboard"
            ], correctIndex:0
          },
          { text:"Visual tool used to build layouts + define navigation/transitions:", choices:[
              "storyboard","SwiftUI","Layout editor","UI inspector"
            ], correctIndex:0
          }
        ]
      },

      {
        title: "Quiz 4 — iOS Segues",
        questions: [
          { text:"This segue displays the new content using showDetailViewController:sender:.", choices:["show","show details","present modally","present as popover"], correctIndex:1 },
          { text:"A ___________ defines a transition between two view controllers in a storyboard.", choices:["segue","transition","passage","link"], correctIndex:0 },
          { text:"How can segues be executed in an iOS application?", choices:["only automatically","only programatically","either automatically or programmatically","segues are not executed"], correctIndex:2 },
          { text:"Which method allows you to prevent segue execution?", choices:["prepare(for:sender:)","shouldPerformSegue(withIdentifier:sender:)","viewDidLoad()","unwind(_: )"], correctIndex:1 },
          { text:"performSegueWithIdentifier(\"SomeIdentifier\", sender: self) does what?", choices:[
              "Triggers transition defined by segue with id SomeIdentifier",
              "Triggers transition to VC with id SomeIdentifier",
              "Triggers transition from VC with id SomeIdentifier",
              "This call is incorrect"
            ], correctIndex:0
          },
          { text:"If the segue is source → destination, you define an unwind action in the destination VC.", choices:["True","False"], correctIndex:1 },
          { text:"A segue is:", choices:[
              "a one-way connection between source and destination view controllers",
              "a two-way connection between source and destination view controllers",
              "a multidirectional connection between multiple view controllers",
              "this name does not have a meaning in iOS"
            ], correctIndex:0
          },
          { text:"This segue displays new content using showViewController:sender:.", choices:["show","show details","present modally","present as popover"], correctIndex:0 },
          { text:"This segue displays a view controller modally using presentation/transition styles.", choices:["show","show details","present modally","present as popover"], correctIndex:2 },
          { text:"Which method allows passing data from source VC to destination VC?", choices:["prepare(for:sender:)","shouldPerformSegue(...)","viewDidLoad()","unwind(_: )"], correctIndex:0 }
        ]
      },

      {
        title: "Quiz 5 — iOS UI / TableView / Gestures",
        questions: [
          { text:"What does it mean that a table view is a data driven view?", choices:[
              "it generates the content based on the data from data source",
              "it generates the content based on the user input",
              "it is controlled by a data source",
              "it is controlled by data entry"
            ], correctIndex:0
          },
          { text:"Select all types of the gesture recognizers (best answer)", choices:[
              "discrete and continuous","discrete","continuous","single-touch","multi-touch"
            ], correctIndex:0
          },
          { text:"Can you set the current value of the slider beyond the range min-max?", choices:[
              "Yes, but only in storyboard/interface builder",
              "Yes, but only programatically",
              "No, it is not possible",
              "Yes, but it will cause a runtime error"
            ], correctIndex:1
          },
          { text:"Arrange the gesture recognizer states in correct order.", choices:[
              "began → changed → ended",
              "changed → began → ended",
              "ended → changed → began",
              "began → ended → changed"
            ], correctIndex:0
          },
          { text:"You cannot customize the UISwitch component", choices:["True","False"], correctIndex:1 },
          { text:"Which can be used to display long lists of elements of the same type?", choices:[
              "UITableView","UIListView","UITextView","UICollectionView"
            ], correctIndex:0
          },
          { text:"Which setting changes the way slider sends updates to controller?", choices:[
              "isContinuous","sentWhenDone","isDoneEditting","isFinished"
            ], correctIndex:0
          },
          { text:"Which displays an editable text area?", choices:[
              "UITextField","UILabel","UITextView","UITextObject"
            ], correctIndex:2
          },
          { text:"What happens when a text field becomes a first responder?", choices:[
              "system shows keyboard and binds input to text field",
              "system hides keyboard and binds input to text field",
              "system hides keyboard and unbinds input to text field",
              "system shows keyboard and unbinds input to text field"
            ], correctIndex:0
          },
          { text:"Which function hides the keyboard?", choices:[
              "resignFirstResponder","resetFirstResponder","resignKeyboard","hideKeyboard"
            ], correctIndex:0
          }
        ]
      },

      {
        title: "Quiz 6 — Sensors & Location Services",
        questions: [
          { text:"Permission to use location data has to be given each time the application tries to access the data.", choices:["True","False"], correctIndex:1 },
          { text:"What does accelerometer measure?", choices:[
              "Change in velocity along axis","Gravitation","Change in position of the device","Change in orientation of the device"
            ], correctIndex:0
          },
          { text:"When is the permission to access the location requested?", choices:[
              "Only on app installation","When application starts","Each time app wants to use location data","When the program requests it at runtime if not permanently given before"
            ], correctIndex:3
          },
          { text:"What is the unit of rotation used by sensors?", choices:[
              "radian/second","degree/second","radian/hour","degree/minute"
            ], correctIndex:0
          },
          { text:"Permission to use location data has to be checked each time the application tries to access the data.", choices:["True","False"], correctIndex:0 },
          { text:"Accelerometer values are increments of gravitational acceleration. What does it mean?", choices:[
              "1.0 represents 9.8 m/s²","1.0 represents 1.0 m/s²","10 represents 9.8 m/s²","10 represents 1.0 m/s²"
            ], correctIndex:0
          },
          { text:"Which framework is used to access sensor data about motion and environment?", choices:[
              "CoreMotion","CoreSensors","SensorManager","SensorCore"
            ], correctIndex:0
          },
          { text:"Which sensor measures the rate at which the device rotates around a specific axis?", choices:[
              "Gyroscope","Accelerometer","Rotationmeter","Spinometer"
            ], correctIndex:0
          },
          { text:"How can energy consumption be minimized when using location services?", choices:[
              "Use significant-change service","Lower the frequency of updates","Both A and B","It is not possible"
            ], correctIndex:2
          },
          { text:"In what format is the acceleration data returned?", choices:[
              "vector with 3 values","vector with 4 values","vector with 1 values","single number"
            ], correctIndex:0
          },
          { text:"Which framework is used to obtain the location information?", choices:[
              "CoreLocation","CoreMotion","CoreGPS","LocationKit"
            ], correctIndex:0
          },
          { text:"What does GPS provide?", choices:[
              "Geographic coordinate position","Device orientation","Device acceleration","Network address"
            ], correctIndex:0
          }
        ]
      }
    ];

    // -----------------------------
    // Helpers
    // -----------------------------
    function shuffle(array){
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

    // We'll build a runtime answer key after shuffling: { qName: correctLetter }
    // Also store choice text mapping for answer key display.
    const runtimeCorrect = {};
    const runtimeCorrectText = {};
    const runtimeChoices = {}; // qName -> [{letter,text,isCorrect}...]

    // -----------------------------
    // Render the exam
    // -----------------------------
    const form = document.getElementById("quizForm");
    let qCounter = 0;

    function render(){
      form.innerHTML = "";
      qCounter = 0;

      sections.forEach(section=>{
        const st = document.createElement("div");
        st.className = "section-title";
        st.textContent = section.title;
        form.appendChild(st);

        section.questions.forEach(q=>{
          qCounter++;
          const qName = `q${qCounter}`;

          // create shuffled choice objects
          const choiceObjs = q.choices.map((text, idx)=>({
            text,
            isCorrect: idx === q.correctIndex
          }));
          shuffle(choiceObjs);

          // assign letters after shuffle
          const withLetters = choiceObjs.map((c, idx)=>({
            letter: LETTERS[idx],
            text: c.text,
            isCorrect: c.isCorrect
          }));

          runtimeChoices[qName] = withLetters;

          const correctObj = withLetters.find(x=>x.isCorrect);
          runtimeCorrect[qName] = correctObj.letter;
          runtimeCorrectText[qName] = correctObj.text;

          // card
          const card = document.createElement("div");
          card.className = "question-card";

          const title = document.createElement("div");
          title.className = "question-title";
          title.textContent = `${qCounter}. ${q.text}`;
          card.appendChild(title);

          // options
          withLetters.forEach(opt=>{
            const lab = document.createElement("label");
            lab.className = "option";
            lab.dataset.q = qName;
            lab.dataset.letter = opt.letter;
            lab.dataset.correct = opt.isCorrect ? "1" : "0";

            const input = document.createElement("input");
            input.type = "radio";
            input.name = qName;
            input.value = opt.letter;

            lab.appendChild(input);
            lab.appendChild(document.createTextNode(` ${opt.letter}) ${opt.text}`));
            card.appendChild(lab);
          });

          // feedback line
          const fb = document.createElement("div");
          fb.className = "feedback";
          fb.id = `fb-${qName}`;
          card.appendChild(fb);

          form.appendChild(card);
        });
      });
    }

    render();

    // -----------------------------
    // Submit + Feedback
    // -----------------------------
    function submitQuiz(){
      let score = 0;
      const total = Object.keys(runtimeCorrect).length;

      // lock
      document.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);

      // clear styles
      document.querySelectorAll("label.option").forEach(l => {
        l.classList.remove("correct","incorrect");
      });

      Object.keys(runtimeCorrect).forEach(qName=>{
        const correctLetter = runtimeCorrect[qName];
        const correctText = runtimeCorrectText[qName];
        const selected = document.querySelector(`input[name="${qName}"]:checked`);
        const fb = document.getElementById(`fb-${qName}`);

        // mark correct option green
        document.querySelectorAll(`label.option[data-q="${qName}"]`).forEach(lab=>{
          if(lab.dataset.letter === correctLetter){
            lab.classList.add("correct");
          }
        });

        if(!selected){
          fb.className = "feedback bad";
          fb.innerHTML = `No answer selected. <b>Correct:</b> ${correctLetter}) ${correctText}`;
          return;
        }

        const chosenLetter = selected.value;
        const chosenObj = runtimeChoices[qName].find(x=>x.letter === chosenLetter);

        if(chosenLetter === correctLetter){
          score++;
          fb.className = "feedback ok";
          fb.innerHTML = `<b>Your answer:</b> ${chosenLetter}) ${chosenObj.text} ✅ <br><b>Correct:</b> ${correctLetter}) ${correctText}`;
        } else {
          // mark chosen wrong red
          const chosenLabel = document.querySelector(`label.option[data-q="${qName}"][data-letter="${chosenLetter}"]`);
          if(chosenLabel) chosenLabel.classList.add("incorrect");

          fb.className = "feedback bad";
          fb.innerHTML = `<b>Your answer:</b> ${chosenLetter}) ${chosenObj.text} ❌ <br><b>Correct:</b> ${correctLetter}) ${correctText}`;
        }
      });

      // score box
      const result = document.getElementById("result");
      const percent = Math.round((score/total)*100);
      result.style.display = "block";
      result.textContent = `Your Score: ${score} / ${total} (${percent}%)`;

      // answer key (optional)
      const keyWrap = document.getElementById("answerKeyWrap");
      const key = document.getElementById("answerKey");

      let html = "";
      for(let i=1;i<=total;i++){
        const qName = `q${i}`;
        html += `<b>Question ${i}:</b> ${runtimeCorrect[qName]}) ${escapeHtml(runtimeCorrectText[qName])}<br>`;
      }
      key.innerHTML = html;
      keyWrap.style.display = "block";

      window.scrollTo({top:0, behavior:"smooth"});
    }

    function resetQuiz(){
      // just reload to reshuffle cleanly
      location.reload();
    }

    // small HTML escape for answer key text
    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll("\"","&quot;")
        .replaceAll("'","&#039;");
    }

    // expose for onclick
    window.submitQuiz = submitQuiz;
    window.resetQuiz = resetQuiz;
  </script>
</body>
</html>
