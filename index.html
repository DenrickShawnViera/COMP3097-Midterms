<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>COMP3097 Study Review (Quiz 1–6)</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --border:#dfe6f1;
      --text:#1f2a44;
      --muted:#667085;
      --good:#1f9d55;
      --bad:#e11d48;
      --accent:#2563eb;
      --shadow: 0 6px 18px rgba(16,24,40,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:var(--bg);
      color:var(--text);
    }
    header{
      background:linear-gradient(135deg, #1e3a8a, #2563eb);
      color:#fff;
      padding:20px 16px;
      box-shadow:var(--shadow);
    }
    .wrap{max-width:980px;margin:0 auto;padding:0 14px}
    h1{margin:0;font-size:20px;font-weight:750}
    .sub{margin-top:6px;font-size:13px;opacity:.92}
    .toolbar{
      display:flex; flex-wrap:wrap; gap:10px;
      align-items:center; justify-content:space-between;
      margin:16px 0 8px;
    }
    .pill{
      display:inline-flex; gap:10px; align-items:center;
      padding:10px 12px; border:1px solid var(--border); border-radius:999px;
      background:#fff;
      font-size:13px;
    }
    .pill b{font-weight:800}
    .btnrow{display:flex; gap:10px; flex-wrap:wrap}
    button{
      border:0; border-radius:10px;
      padding:10px 12px;
      font-weight:800; cursor:pointer;
      transition: transform .05s ease;
    }
    button:active{transform:translateY(1px)}
    .primary{background:var(--accent);color:#fff; box-shadow: 0 8px 20px rgba(37,99,235,.16)}
    .ghost{background:#fff;color:var(--text);border:1px solid var(--border)}
    main{padding:10px 0 30px}

    details.quiz{
      margin-top:14px;
      border:1px solid var(--border);
      border-radius:14px;
      background: rgba(255,255,255,.7);
      overflow:hidden;
    }
    summary{
      list-style:none;
      cursor:pointer;
      padding:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      font-weight:850;
      background:#f8fafc;
      border-bottom:1px solid var(--border);
    }
    summary::-webkit-details-marker{display:none}
    .qcount{font-size:12px;color:var(--muted);font-weight:700}
    .quizBody{padding:10px 14px 14px}

    .notice{
      padding:12px;
      border:1px dashed #c7d2fe;
      border-radius:12px;
      background:#fff;
      color:var(--muted);
      font-size:13px;
      margin-top:10px;
    }

    .q{
      margin-top:12px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      overflow:hidden;
      box-shadow: var(--shadow);
    }
    .qhead{
      display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
      padding:12px 14px;
      background: #f8fafc;
      border-bottom:1px solid var(--border);
    }
    .qtitle{font-weight:900;font-size:13px}
    .points{font-size:12px;color:var(--muted);white-space:nowrap}
    .qbody{padding:12px 14px}
    .prompt{margin:0 0 10px;font-size:14px;line-height:1.35;white-space:pre-wrap}
    .choices{display:grid; gap:10px}
    label.choice{
      display:flex; gap:10px; align-items:flex-start;
      padding:10px 10px;
      border:1px solid var(--border);
      border-radius:12px;
      cursor:pointer;
      background:#fff;
    }
    label.choice:hover{border-color:#c7d2fe}
    input[type="radio"]{margin-top:2px; transform:scale(1.05)}
    .feedback{
      margin-top:10px;
      font-size:13px;
      display:none;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#fff;
    }
    .feedback.ok{display:block;border-color: rgba(31,157,85,.35); background: rgba(31,157,85,.06)}
    .feedback.bad{display:block;border-color: rgba(225,29,72,.35); background: rgba(225,29,72,.06)}
    .mark{font-weight:900}
    .mark.ok{color:var(--good)}
    .mark.bad{color:var(--bad)}
    .correctChoice{
      outline: 2px solid rgba(31,157,85,.40);
      background: rgba(31,157,85,.06);
      border-color: rgba(31,157,85,.40) !important;
    }
    .wrongChoice{
      outline: 2px solid rgba(225,29,72,.25);
      background: rgba(225,29,72,.05);
      border-color: rgba(225,29,72,.25) !important;
    }
    footer{color:var(--muted);font-size:12px;padding:18px 0 28px}
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1>Study Review Exam (Quiz 1–6)</h1>
    <div class="sub">Separate sections • 1 point each • Submit to see score + correct answers • No timer</div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="pill">
      <span><b id="countQ">0</b> questions</span>
      <span>•</span>
      <span>Total: <b id="totalPts">0</b> points</span>
      <span>•</span>
      <span>Score: <b id="scoreNow">—</b></span>
    </div>
    <div class="btnrow">
      <button class="primary" id="btnSubmit">Submit All</button>
      <button class="ghost" id="btnReset">Reset</button>
    </div>
  </div>

  <main id="exam"></main>

  <footer>
    Tip: Open each quiz section, answer, then click <b>Submit All</b>.
  </footer>
</div>

<script>
  // =========================
  // QUIZ DATA (1 → 6)
  // =========================
  // NOTE: Quiz 3 not provided by user yet → placeholder.
  const data = [
    // -------------------------
    // Quiz 1 (Swift Basics) — from your screenshot
    // -------------------------
    { quiz: 1, title: "Quiz 1 — Swift Basics", questions: [
      { prompt: "In Swift, functions can be passed as parameters to other functions and they can be returned from functions.", choices:["True","False"], answerIndex:0 },
      { prompt: "In Swift, all types contain a nil as a possible value", choices:["True","False"], answerIndex:1 },
      { prompt: "How the optional type is denoted in Swift?", choices:[
          "by adding a question mark (?) after the name of the type",
          "by adding an exclamation mark (!) after the name of the type",
          "by adding a question mark (?) infront of the name of the type",
          "by adding an exclamation mark (!) infront of the name of the type"
        ], answerIndex:0
      },
      { prompt: "Which of the following statement(s) can be used to declare an integer constant of value 5 in Swift?", choices:[
          "let x = 5",
          "let Int x = 5",
          "const x:Int",
          "x=5",
          "const x = 5"
        ], answerIndex:0
      },
      { prompt: "Which of the following is true?", choices:[
          "In Swift, values are never converted (cast operation) automatically to another type",
          "In Swift, values are always converted (cast operation) automatically to another type if needed",
          "In Swift, convertion (cast operation) is not possible at all",
          "There is no such thing as a cast operation in programming languages"
        ], answerIndex:0
      },
      { prompt: "Swift requires each line to be terminated by a semicolon ';'.", choices:["True","False"], answerIndex:1 },
      { prompt: "Consider a variable x that is an integer. If you would like to print the value as part of a text, e.g. for x=5, the printed text would be:\n\nValue of x is: 5\n\nWhich of the following expressions would you use?", choices:[
          "print(\"Value of x is: \\(x)\")",
          "print(\"Value of x is: \"+String(x))",
          "print(\"Value of x is: \", x)",
          "All of the above"
        ], answerIndex:3
      },
      { prompt: "Which of the following expressions allows us to declare an array?", choices:[
          "var shoppingList = [\"catfish\", \"water\", \"tulips\", \"blue paint\"]",
          "var shoppingList = (\"catfish\", \"water\", \"tulips\", \"blue paint\")",
          "array shoppingList = [\"catfish\", \"water\", \"tulips\", \"blue paint\"]",
          "var shoppingList = array[\"catfish\", \"water\", \"tulips\", \"blue paint\"]"
        ], answerIndex:0
      },
      { prompt: "Which of the following expressions can be used to declare a function that takes an integer as a parameter and returns string?", choices:[
          "func foo(a:Int)->String",
          "function foo(a:Int)->String",
          "func foo(a:Int):String",
          "function foo(a:Int):String"
        ], answerIndex:0
      },
      { prompt: "Select the statement that is correct and the most complete describing Swift", choices:[
          "Swift is a strongly typed language that allows for the type inference",
          "Swift is a weakly typed language that allows for the type inference",
          "Swift is a strongly typed language that does not allow for the type inference",
          "Swift is a weakly typed language that does not allow for the type inference"
        ], answerIndex:0
      }
    ]},

    // -------------------------
    // Quiz 2 (SwiftUI) — from your screenshot
    // -------------------------
    { quiz: 2, title: "Quiz 2 — SwiftUI", questions: [
      { prompt: "SwiftUI can be only used to define UI for simple applications", choices:["True","False"], answerIndex:1 },
      { prompt: "SwiftUI uses a declarative approach", choices:["True","False"], answerIndex:0 },
      { prompt: "The origin of the UI element in iOS app is the upper-left corner", choices:["True","False"], answerIndex:0 },
      { prompt: "What is SwiftUI?", choices:[
          "It is an innovative way to build user interfaces using Swift",
          "It is a UI component defined in Swift",
          "It is a UI component allowing user to code in Swift",
          "It is a scripting language that supports Storyboard"
        ], answerIndex:0
      },
      { prompt: "What is the name of the visual tool that is used to build layouts for the iOS application as well as to define navigation and transitions between screens in the application?", choices:[
          "storyboard",
          "SwiftUI",
          "Layout editor",
          "UI inspector"
        ], answerIndex:0
      }
    ]},

    // -------------------------
    // Quiz 3 (NOT PROVIDED YET)
    // -------------------------
    { quiz: 3, title: "Quiz 3 — (Missing Questions)", questions: [] },

    // -------------------------
    // Quiz 4 (iOS Segues) — from your Quiz4 doc
    // -------------------------
    { quiz: 4, title: "Quiz 4 — iOS Segues", questions: [
      { prompt:"This segue displays the new content using the showDetailViewController:sender: method of the target view controller.", choices:["show","show details","present modally","present as popover"], answerIndex:1 },
      { prompt:"A ___________ defines a transition between two view controllers in your app's storyboard file.", choices:["segue","transition","passage","link"], answerIndex:0 },
      { prompt:"How can segues be executed in an iOS application?", choices:["only automatically","only programatically","either automatically or programmatically","segues are not executed, they are symbolic"], answerIndex:2 },
      { prompt:"Which of the following methods allows you to prevent segue execution?", choices:["prepare(for segue: sender:)","shouldPerformSegue(with identifier: sender:)","viewDidLoad()","unwind(_ seg:)"], answerIndex:1 },
      { prompt:"What does this function call do?\nperformSegueWithIdentifier(\"SomeIdentifier\", sender: self)", choices:["Triggers transition defined by the segue with id SomeIdentifier","Triggers transition to the view controller with id SomeIdentifier","Triggers transition from the view controller with id SomeIdentifier","This call is incorrect, function does not exist"], answerIndex:0 },
      { prompt:"If the segue looks like the following:\nsource -------> destination\nYou define an unwind action method in the destination view controller.", choices:["True","False"], answerIndex:1 },
      { prompt:"A segue is ______________", choices:["a one-way connection between source and destination view controllers","a two-way connection between source and destination view controllers","a multidirectional connection between miltiple view controllers","this name does not have a meaning in iOS"], answerIndex:0 },
      { prompt:"This segue displays the new content using the showViewController:sender: method of the target view controller.", choices:["show","show details","present modally","present as popover"], answerIndex:0 },
      { prompt:"This segue displays the view controller modally using the specified presentation and transition styles. The view controller that defines the appropriate presentation context handles the actual presentation.", choices:["show","show details","present modally","present as popover"], answerIndex:2 },
      { prompt:"Which of the following methods allows you to pass data from source view controller to the destination view controller?", choices:["prepare(for: sender:)","shouldPerformSegue(with identifier: sender:)","viewDidLoad()","unwind(_ seg:)"], answerIndex:0 }
    ]},

    // -------------------------
    // Quiz 5 (UI/TableView/Gestures) — from your Quiz5 doc
    // -------------------------
    { quiz: 5, title: "Quiz 5 — iOS UI / TableView / Gestures", questions: [
      { prompt:"What does it mean that a table view is a data driven view?", choices:[
          "it generates the content based on the data from data source",
          "it generates the content based on the user input",
          "it is controlled by a data source",
          "it is controlled by data entry"
        ], answerIndex:0
      },
      { prompt:"Select all types of the gesture recognizers from the following list (Choose the best answer)", choices:[
          "discrete and continuous",
          "discrete",
          "continuous",
          "single-touch",
          "multi-touch"
        ], answerIndex:0
      },
      { prompt:"Can you set the current value of the slider beyond the range min-max?", choices:[
          "Yes, but only in storyboard/interface builder",
          "Yes, but only programatically",
          "No, it is not possible",
          "Yes, but it will cause a runtime error"
        ], answerIndex:1
      },
      { prompt:"Arrange the gesture recognizer states in correct order.", choices:[
          "began → changed → ended",
          "changed → began → ended",
          "ended → changed → began",
          "began → ended → changed"
        ], answerIndex:0
      },
      { prompt:"You cannot customize the UISwitch component", choices:["True","False"], answerIndex:1 },
      { prompt:"Which of the following can be used to display long lists of elements of the same type?", choices:[
          "UITableView","UIListView","UITextView","UICollectionView"
        ], answerIndex:0
      },
      { prompt:"Which setting changes the way in which slider send the updates to the controller (either continuously or when user done changing)?", choices:[
          "isContinuous","sentWhenDone","isDoneEditting","isFinished"
        ], answerIndex:0
      },
      { prompt:"Which of the following displays an editable text area in the interface?", choices:[
          "UITextField","UILabel","UITextView","UITextObject"
        ], answerIndex:2
      },
      { prompt:"What happens when a text fied becomes a first responder?", choices:[
          "the system automatically shows the keyboard and binds the input to the text field",
          "the system automatically hides the keyboard and binds the input to the text field",
          "the system automatically hides the keyboard and unbinds the input to the text field",
          "the system automatically shows the keyboard and unbinds the input to the text field"
        ], answerIndex:0
      },
      { prompt:"Which of the following functions hides the keyboard?", choices:[
          "resignFirstResponder","resetFirstResponder","resignKeyboard","hideKeyboard"
        ], answerIndex:0
      }
    ]},

    // -------------------------
    // Quiz 6 (Sensors/Location) — from your Quiz6 doc (12 questions)
    // -------------------------
    { quiz: 6, title: "Quiz 6 — Sensors & Location Services", questions: [
      { prompt:"Permission to use location data has to be given each time the application tries to access the data.", choices:["True","False"], answerIndex:1 },
      { prompt:"What does accelerometer measure?", choices:[
          "Change in velocity along axis","Gravitation","Change in position of the device","Change in orientation of the device"
        ], answerIndex:0
      },
      { prompt:"When is the permission to access the location requested?", choices:[
          "Only on app installation","When application starts","Each time app wants to use location data","When the program requests it at runtime if not permanently given before"
        ], answerIndex:3
      },
      { prompt:"What is the unit of rotation used by sensors?", choices:[
          "radian/second","degree/second","radian/hour","degree/minute"
        ], answerIndex:0
      },
      { prompt:"Permission to use location data has to be checked each time the application tries to access the data.", choices:["True","False"], answerIndex:0 },
      { prompt:"Accelerometer values are increments of gravitational acceleration. What does it mean?", choices:[
          "1.0 represents 9.8 m/s²","1.0 represents 1.0 m/s²","10 represents 9.8 m/s²","10 represents 1.0 m/s²"
        ], answerIndex:0
      },
      { prompt:"Which framework is used to access sensor data about motion and environment?", choices:[
          "CoreMotion","CoreSensors","SensorManager","SensorCore"
        ], answerIndex:0
      },
      { prompt:"Which sensor measures the rate at which the device rotates around a specific axis?", choices:[
          "Gyroscope","Accelerometer","Rotationmeter","Spinometer"
        ], answerIndex:0
      },
      { prompt:"How can energy consumption be minimized when using location services?", choices:[
          "Use significant-change service","Lower the frequency of updates","Both A and B","It is not possible"
        ], answerIndex:2
      },
      { prompt:"In what format is the acceleration data returned?", choices:[
          "vector with 3 values","vector with 4 values","vector with 1 values","single number"
        ], answerIndex:0
      },
      { prompt:"Which framework is used to obtain the location information?", choices:[
          "CoreLocation","CoreMotion","CoreGPS","LocationKit"
        ], answerIndex:0
      },
      { prompt:"What does GPS provide?", choices:[
          "Geographic coordinate position","Device orientation","Device acceleration","Network address"
        ], answerIndex:0
      }
    ]}
  ];

  // =========================
  // RENDER
  // =========================
  const exam = document.getElementById("exam");
  const flat = []; // all questions with global id

  function render(){
    exam.innerHTML = "";
    flat.length = 0;

    data.forEach(quizObj=>{
      const d = document.createElement("details");
      d.className = "quiz";
      d.open = (quizObj.quiz === 1); // open Quiz 1 by default

      const s = document.createElement("summary");
      const left = document.createElement("div");
      left.textContent = quizObj.title;

      const right = document.createElement("div");
      right.className = "qcount";
      right.textContent = `${quizObj.questions.length} questions`;

      s.appendChild(left);
      s.appendChild(right);
      d.appendChild(s);

      const body = document.createElement("div");
      body.className = "quizBody";

      if(quizObj.questions.length === 0){
        const n = document.createElement("div");
        n.className = "notice";
        n.innerHTML = `<b>Quiz 3 is missing.</b><br/>You didn’t send Quiz 3 questions. Upload the Quiz 3 file or screenshot and I’ll add it here.`;
        body.appendChild(n);
      }

      quizObj.questions.forEach((q, localIndex)=>{
        const globalIndex = flat.length + 1;
        flat.push({ quiz: quizObj.quiz, q, globalIndex });

        const card = document.createElement("div");
        card.className = "q";
        card.id = `card-q${globalIndex}`;

        const head = document.createElement("div");
        head.className = "qhead";

        const t = document.createElement("div");
        t.className = "qtitle";
        t.textContent = `Question ${localIndex + 1}`;

        const pts = document.createElement("div");
        pts.className = "points";
        pts.textContent = "1 / 1 point";

        head.appendChild(t);
        head.appendChild(pts);

        const qbody = document.createElement("div");
        qbody.className = "qbody";

        const pr = document.createElement("p");
        pr.className = "prompt";
        pr.textContent = q.prompt;

        const choices = document.createElement("div");
        choices.className = "choices";

        q.choices.forEach((choiceText, cidx)=>{
          const lab = document.createElement("label");
          lab.className = "choice";
          lab.dataset.q = `q${globalIndex}`;
          lab.dataset.c = String(cidx);

          const inp = document.createElement("input");
          inp.type = "radio";
          inp.name = `q${globalIndex}`;
          inp.value = String(cidx);

          const span = document.createElement("span");
          span.textContent = choiceText;

          lab.appendChild(inp);
          lab.appendChild(span);
          choices.appendChild(lab);
        });

        const fb = document.createElement("div");
        fb.className = "feedback";
        fb.id = `fb-q${globalIndex}`;

        qbody.appendChild(pr);
        qbody.appendChild(choices);
        qbody.appendChild(fb);

        card.appendChild(head);
        card.appendChild(qbody);
        body.appendChild(card);
      });

      d.appendChild(body);
      exam.appendChild(d);
    });

    document.getElementById("countQ").textContent = String(flat.length);
    document.getElementById("totalPts").textContent = String(flat.length);
    document.getElementById("scoreNow").textContent = "—";
  }

  // =========================
  // GRADE + RESET
  // =========================
  function gradeAll(){
    let score = 0;

    document.querySelectorAll("label.choice").forEach(l=>{
      l.classList.remove("correctChoice","wrongChoice");
    });

    flat.forEach(({q, globalIndex})=>{
      const picked = document.querySelector(`input[name="q${globalIndex}"]:checked`);
      const fb = document.getElementById(`fb-q${globalIndex}`);
      const correctIdx = q.answerIndex;

      const correctLabel = document.querySelector(`label.choice[data-q="q${globalIndex}"][data-c="${correctIdx}"]`);
      if(correctLabel) correctLabel.classList.add("correctChoice");

      if(!picked){
        fb.className = "feedback bad";
        fb.innerHTML = `<span class="mark bad">✗</span> No answer selected. Correct answer: <b>${q.choices[correctIdx]}</b>`;
        return;
      }

      const pickedIdx = Number(picked.value);
      const pickedLabel = document.querySelector(`label.choice[data-q="q${globalIndex}"][data-c="${pickedIdx}"]`);

      if(pickedIdx === correctIdx){
        score++;
        fb.className = "feedback ok";
        fb.innerHTML = `<span class="mark ok">✓</span> Correct!`;
      } else {
        if(pickedLabel) pickedLabel.classList.add("wrongChoice");
        fb.className = "feedback bad";
        fb.innerHTML = `<span class="mark bad">✗</span> Incorrect. Correct answer: <b>${q.choices[correctIdx]}</b>`;
      }
    });

    document.getElementById("scoreNow").textContent = `${score} / ${flat.length}`;
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function resetAll(){
    document.querySelectorAll('input[type="radio"]').forEach(r=>r.checked=false);
    document.querySelectorAll(".feedback").forEach(f=>{
      f.className="feedback";
      f.innerHTML="";
    });
    document.querySelectorAll("label.choice").forEach(l=>{
      l.classList.remove("correctChoice","wrongChoice");
    });
    document.getElementById("scoreNow").textContent = "—";
    window.scrollTo({top:0, behavior:"smooth"});
  }

  document.getElementById("btnSubmit").addEventListener("click", gradeAll);
  document.getElementById("btnReset").addEventListener("click", resetAll);

  render();
</script>
</body>
</html>
